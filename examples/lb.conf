# Example: an HTTP listener with routing, a TCP listener, and the admin API.
# Start three demo backends first (see scripts/demo.sh or scripts/demo.ps1).

threads 4
admin 127.0.0.1:9901

# HTTP pool: least-connections with active HTTP health checks.
pool web algorithm=least_connections health=http health_path=/health interval_ms=1000 timeout_ms=500 rise=2 fall=2 max_fails=3 eject_ms=10000
backend web 127.0.0.1:9001
backend web 127.0.0.1:9002
backend web 127.0.0.1:9003 weight=2

# A canary pool that only receives requests carrying "X-Canary: 1".
pool canary algorithm=round_robin health=http health_path=/health
backend canary 127.0.0.1:9003

# TCP pool: smooth weighted round-robin with TCP connect checks.
pool echo algorithm=weighted_round_robin health=tcp interval_ms=1000
backend echo 127.0.0.1:9101 weight=3
backend echo 127.0.0.1:9102 weight=1

listener http mode=http bind=0.0.0.0:8080 retries=2 connect_timeout_ms=1000 response_timeout_ms=30000
route http header=X-Canary:1 pool=canary
route http pool=web

listener tcp mode=tcp bind=0.0.0.0:9000 pool=echo
